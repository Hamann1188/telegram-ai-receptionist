name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: receptionist
          POSTGRES_PASSWORD: receptionist
          POSTGRES_DB: receptionist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receptionist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RECEPTIONIST_TEST_DATABASE_URL: postgresql+asyncpg://receptionist:receptionist@localhost:5432/receptionist_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full version tags (no floating major tag since v8)
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Job logs need repo admin rights to download, so the summary and every failure
      # are also published as annotations, which the public API returns.
      - name: pytest
        shell: bash
        run: |
          set +e
          uv run pytest -rfEs | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "::notice title=pytest::$(tail -n 1 pytest.log)"
          grep -E "^(FAILED|ERROR) " pytest.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          exit "$status"
