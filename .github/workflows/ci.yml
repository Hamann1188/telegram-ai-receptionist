name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full version tags (no floating major tag since v8)
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: pytest
        shell: bash  # -eo pipefail, so a failing pytest still fails the step
        run: |
          uv run pytest -rs | tee pytest.log
          echo "::notice title=pytest::$(tail -n 1 pytest.log)"
